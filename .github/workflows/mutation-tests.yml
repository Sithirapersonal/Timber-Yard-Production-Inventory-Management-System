name: Mutation tests

on:
  workflow_dispatch:
  push:
    branches:
      # temporary: remove before the final merge
      - feature/mutation-testing
  pull_request:
    branches:
      - develop
      - main
    paths:
      - .github/workflows/mutation-tests.yml
      - mutation-testing/**

permissions:
  contents: read

jobs:
  mutation-tests:
    name: Stryker - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: logintake
            test-project: LogIntakeService.Tests
            config: logintake.stryker-config.json
          - service: sawmill
            test-project: SawmillService.Tests
            config: sawmill.stryker-config.json
          - service: treatment
            test-project: TreatmentService.Tests
            config: treatment.stryker-config.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore "${{ matrix.test-project }}/${{ matrix.test-project }}.csproj"

      - name: Initialize MySQL schema
        if: matrix.service == 'logintake' || matrix.service == 'treatment'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.service }}" in
            logintake) schema="LogIntakeService/Database/schema.sql" ;;
            treatment) schema="TreatmentService/Database/schema.sql" ;;
            *)
              echo "No database schema is required for ${{ matrix.service }}."
              exit 0
              ;;
          esac
          docker exec -i "${{ job.services.mysql.id }}" mysql -uroot < "$schema"

      - name: Run unit tests
        run: dotnet test "${{ matrix.test-project }}/${{ matrix.test-project }}.csproj" --nologo

      - name: Run Stryker
        working-directory: ${{ matrix.test-project }}
        run: >-
          dotnet stryker
          --config-file "../mutation-testing/${{ matrix.config }}"
          --output "../mutation-testing/output/${{ matrix.service }}"
          --break-on-initial-test-failure

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.service }}
          path: |
            mutation-testing/output/${{ matrix.service }}/reports/mutation-report.html
            mutation-testing/output/${{ matrix.service }}/reports/mutation-report.json
          if-no-files-found: warn

      - name: Add mutation score to job summary
        if: always()
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          service = os.environ["SERVICE"]
          path = f"mutation-testing/output/{service}/reports/mutation-report.json"
          print(f"## Mutation result: {service}\n")

          if not os.path.exists(path):
              print("Report not found; Stryker probably failed before writing results.")
              raise SystemExit(0)

          with open(path, encoding="utf-8") as report_file:
              report = json.load(report_file)

          counts = {}
          for file_result in report.get("files", {}).values():
              for mutant in file_result.get("mutants", []):
                  status = mutant["status"]
                  counts[status] = counts.get(status, 0) + 1

          killed = counts.get("Killed", 0)
          survived = counts.get("Survived", 0)
          timeout = counts.get("Timeout", 0)
          no_coverage = counts.get("NoCoverage", 0)
          denominator = killed + survived + timeout + no_coverage
          score = (100.0 * killed / denominator) if denominator else 0.0

          print(f"**Mutation score: {score:.2f}%**\n")
          print("| Killed | Survived | Timeout | No coverage |")
          print("| ---: | ---: | ---: | ---: |")
          print(f"| {killed} | {survived} | {timeout} | {no_coverage} |")
          PY
