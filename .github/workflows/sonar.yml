name: SonarQube
on:
  push:
    branches:
      - main
      - develop
      - feature/code-quality-metrics
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Begin analysis
        run: >
          dotnet sonarscanner begin
          /k:"Sithirapersonal_Timber-Yard-Production-Inventory-Management-System"
          /o:"sithirapersonal"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage/*.xml"

      - name: Build all projects
        run: |
          for proj in $(find . -name "*.csproj" -not -path "*/node_modules/*"); do
            echo "Building $proj"
            dotnet build "$proj" || exit 1
          done

      - name: Test with coverage
        run: |
          mkdir -p coverage
          for proj in $(grep -rl "Microsoft.NET.Test.Sdk" --include=*.csproj . | grep -v "UiTests"); do
            name=$(basename "$proj" .csproj)
            echo "Testing $proj"
            dotnet-coverage collect "dotnet test $proj" -f xml -o "coverage/$name.xml" || echo "Tests failed in $proj, continuing"
          done

      - name: End analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  ui-tests:
    name: Selenium UI tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Allow Chrome sandbox on Ubuntu runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run UI tests
        run: xvfb-run -a dotnet test UiTests/UiTests.csproj
