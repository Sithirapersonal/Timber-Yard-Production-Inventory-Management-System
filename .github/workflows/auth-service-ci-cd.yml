name: auth-service-ci-cd
on:
  push:
    branches: [develop, main]
    paths: ['AuthService/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AuthService
      - run: dotnet build AuthService --no-restore

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish AuthService -c Release -o AuthService/publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'timber-yard-auth-service'
          publish-profile: ${{ secrets.AZURE_AUTH_SERVICE_PUBLISH_PROFILE }}
          package: AuthService/publish